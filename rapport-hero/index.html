<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport — feedback before you find the words</title>
<style>
  :root {
    --bone: #f6f3ed;
    --ink: #1a1815;
    --ink-soft: #6b665e;
    --vermilion: #e8501f;
    --mono: "SF Mono", ui-monospace, "Fira Code", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bone); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(320px, 5fr) 6fr;
    align-items: center;
    gap: 2rem;
    padding: 0 clamp(2rem, 6vw, 6rem);
  }
  nav {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 2rem clamp(2rem, 6vw, 6rem);
    opacity: 0; animation: ink-in 1.2s ease 3.2s forwards;
  }
  .wordmark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.35rem; letter-spacing: -0.01em;
  }
  .wordmark::after { content: "."; color: var(--vermilion); }
  nav .dl {
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink-soft);
    text-decoration: none; border-bottom: 1px solid transparent;
  }
  nav .dl:hover { color: var(--ink); border-bottom-color: var(--vermilion); }

  .copy { position: relative; z-index: 2; }
  .copy > * { opacity: 0; transform: translateY(14px); }
  .copy .reveal { animation: ink-in 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 4.6vw, 4.4rem);
    line-height: 1.06;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; }
  .sub {
    margin-top: 1.4rem;
    font-size: 1.02rem; line-height: 1.55; color: var(--ink-soft);
    max-width: 34ch;
  }
  .cta-row { margin-top: 2.2rem; display: flex; align-items: center; gap: 1.6rem; }
  .cta {
    display: inline-block; background: var(--ink); color: var(--bone);
    font-size: 0.95rem; padding: 0.85rem 1.6rem; border-radius: 999px;
    text-decoration: none; transition: background 0.25s;
  }
  .cta:hover { background: var(--vermilion); }
  .cta-note { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); }

  @keyframes ink-in { to { opacity: 1; transform: translateY(0); } }

  .face-wrap { position: relative; height: min(82vh, 760px); }
  canvas#face { width: 100%; height: 100%; display: block; }

  /* gaze readout */
  .readout {
    position: absolute;
    font-family: var(--mono); font-size: 0.72rem;
    color: var(--vermilion);
    background: var(--bone);
    padding: 4px 8px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--vermilion) 35%, transparent);
    white-space: nowrap;
    opacity: 0; transition: opacity 0.6s;
    pointer-events: none;
  }
  .readout { transform: translateX(-50%); }
  .readout.on { opacity: 1; }
  .readout .tick { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--vermilion); margin-right: 8px; vertical-align: -1px;
    animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: 0.6; } }

  /* hesitation annotation */
  .hesitate {
    position: fixed; z-index: 50;
    font-family: var(--mono); font-size: 0.7rem; color: var(--vermilion);
    background: var(--bone); padding: 3px 7px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--vermilion) 35%, transparent);
    pointer-events: none; opacity: 0; transition: opacity 0.4s;
    transform: translate(14px, 18px); white-space: nowrap;
  }
  .hesitate.on { opacity: 1; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-top: 6rem; }
    .face-wrap { height: 55vh; order: -1; }
  }
</style>
</head>
<body>

<section class="hero">
  <nav>
    <span class="wordmark">rapport</span>
    <a class="dl" href="#">download for mac ↓</a>
  </nav>

  <div class="copy">
    <h1 class="reveal" style="animation-delay: 2.5s">Feedback before<br>you find <em>the words.</em></h1>
    <p class="sub reveal" style="animation-delay: 2.9s">Rapport reads your reactions while you review your agent's design work — and hands the agent one structured brief about what you actually felt.</p>
    <div class="cta-row reveal" style="animation-delay: 3.3s">
      <a class="cta" id="cta" href="#">Try Rapport</a>
      <span class="cta-note">macOS · runs on device</span>
    </div>
  </div>

  <div class="face-wrap">
    <canvas id="face"></canvas>
    <div class="readout" id="readout"><span class="tick"></span><span id="readout-text"></span></div>
  </div>
</section>

<div class="hesitate" id="hesitate">noticed: hesitation · <span id="hes-t">0.0</span>s</div>

<script>
(() => {
  const canvas = document.getElementById('face');
  const ctx = canvas.getContext('2d');
  const CELL = 7;              // sampling cell in css px
  const dots = [];
  let W, H, dpr;
  let mouse = { x: -9999, y: -9999 };
  let t0 = null;
  const CONVERGE_MS = 2200;    // noise -> face duration
  const HOLD_MS = 500;         // beat of pure noise before converge

  const img = new Image();
  img.src = 'face.jpg';

  function build() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // draw image cover-cropped into offscreen at canvas size
    const SW = Math.floor(W), SH = Math.floor(H);
    const off = document.createElement('canvas');
    off.width = SW; off.height = SH;
    const octx = off.getContext('2d');
    const s = Math.max(SW / img.width, SH / img.height);
    const iw = img.width * s, ih = img.height * s;
    octx.drawImage(img, (SW - iw) / 2, (SH - ih) * 0.25, iw, ih); // bias crop upward toward face
    const data = octx.getImageData(0, 0, SW, SH).data;

    dots.length = 0;
    for (let y = CELL / 2; y < SH; y += CELL) {
      for (let x = CELL / 2; x < SW; x += CELL) {
        const i = ((y | 0) * SW + (x | 0)) * 4;
        const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
        const r = Math.pow(1 - lum, 1.9) * CELL * 0.60; // gamma curve: suppress mid-gray background
        if (r < 0.7) continue;               // skip light cells
        dots.push({
          tx: x, ty: y, r,
          // scattered start: random position anywhere in canvas, tiny radius
          sx: Math.random() * W, sy: Math.random() * H,
          delay: Math.random() * 600,        // stagger
          x: 0, y: 0
        });
      }
    }
  }

  const easeOut = p => 1 - Math.pow(1 - p, 4);

  function frame(now) {
    if (!t0) t0 = now;
    const t = now - t0 - HOLD_MS;
    ctx.clearRect(0, 0, W, H);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink');
    const verm = getComputedStyle(document.documentElement).getPropertyValue('--vermilion');

    for (const d of dots) {
      const p = Math.min(Math.max((t - d.delay) / CONVERGE_MS, 0), 1);
      const e = easeOut(p);
      d.x = d.sx + (d.tx - d.sx) * e;
      d.y = d.sy + (d.ty - d.sy) * e;

      // cursor proximity: dots swell + warm near the cursor ("it notices you")
      const dx = d.x - mouse.x, dy = d.y - mouse.y;
      const dist2 = dx * dx + dy * dy;
      const near = dist2 < 2500 ? 1 - Math.sqrt(dist2) / 50 : 0;

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * (0.25 + 0.75 * e) * (1 + near * 0.25), 0, 6.2832);
      ctx.fillStyle = near > 0.35 ? verm : ink;
      ctx.globalAlpha = 0.25 + 0.75 * e;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  img.onload = () => {
    build();
    requestAnimationFrame(frame);

    // gaze readout lands near the eye after the face resolves
    setTimeout(() => {
      const ro = document.getElementById('readout');
      ro.style.left = '58%'; ro.style.top = '30%';
      ro.classList.add('on');
      typeOut('joy · valence +0.87 · arousal 0.62');
    }, HOLD_MS + CONVERGE_MS + 300);
  };

  function typeOut(str) {
    const el = document.getElementById('readout-text');
    let i = 0;
    const tick = () => { el.textContent = str.slice(0, ++i); if (i < str.length) setTimeout(tick, 28); };
    tick();
  }

  window.addEventListener('resize', () => { if (img.complete) build(); });
  canvas.parentElement.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  });
  canvas.parentElement.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });

  // ---------- hesitation annotation ----------
  const hes = document.getElementById('hesitate');
  const hesT = document.getElementById('hes-t');
  let idleTimer = null, idleStart = 0, counting = null;
  window.addEventListener('mousemove', e => {
    hes.style.left = e.clientX + 'px';
    hes.style.top = e.clientY + 'px';
    hes.classList.remove('on');
    clearTimeout(idleTimer); clearInterval(counting);
    idleTimer = setTimeout(() => {
      idleStart = performance.now();
      hes.classList.add('on');
      counting = setInterval(() => {
        hesT.textContent = ((performance.now() - idleStart) / 1000).toFixed(1);
      }, 100);
    }, 1100);
  });
})();
</script>
</body>
</html>
