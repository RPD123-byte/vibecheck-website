<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vibe check — reactions that teach your agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:wght@400..800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FDFBF7;
      --ink: #4A4458;
      --ink-soft: #8A8496;
      --blush: #F4A7B9;
      --blush-deep: #E98AA2;
      --powder: #BFE0F5;
      --butter: #FCE8A8;
      --mint: #C9EBD4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
      padding: 24px;
    }
    .fade-item {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease;
    }
    body.revealed .fade-item {
      opacity: 1;
      transform: translateY(0);
    }
    body.revealed .fade-item:nth-child(2) { transition-delay: 0.15s; }
    body.revealed .fade-item:nth-child(3) { transition-delay: 0.35s; }
    body.revealed .fade-item:nth-child(4) { transition-delay: 0.55s; }
    body.revealed .fade-item:nth-child(5) { transition-delay: 0.8s; }

    .eyebrow {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(56px, 9vw, 96px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .blurb {
      max-width: 640px;
      font-size: 19px;
      line-height: 30px;
      font-weight: 500;
      margin-top: 40px;
    }
    .cta-row {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--blush);
      color: #fff;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: 19px;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .cta:hover { background: var(--blush-deep); transform: translateY(-2px); }
    .cta-github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ink, #1b1b1b);
      color: #fff;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .cta-github:hover { transform: translateY(-2px); opacity: 0.85; }
    .cta-github svg { width: 28px; height: 28px; fill: currentColor; }
    .cta-sub {
      margin-top: 14px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
    }

    .faces {
      margin-top: 72px;
      display: flex;
      gap: 64px;
    }
    .face {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      animation: bob 3.2s ease-in-out infinite;
    }
    .face:nth-child(1) { background: var(--blush); transform: rotate(-6deg); }
    .face:nth-child(2) { background: var(--powder); transform: rotate(4deg); animation-delay: 0.4s; }
    .face:nth-child(3) { background: var(--mint); transform: rotate(-3deg); animation-delay: 0.8s; }
    .face:nth-child(4) { background: var(--butter); transform: rotate(7deg); animation-delay: 1.2s; }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -12px; }
    }

    @media (max-width: 720px) {
      .faces { gap: 24px; }
      .face { width: 64px; height: 64px; font-size: 36px; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1 class="fade-item">vibe check</h1>
    <p class="blurb fade-item">React to what Codex is doing with a smile, a wince, or a full-on 🤢<br />now your face is a feedback loop.</p>
    <div class="fade-item">
      <div class="cta-row">
        <a class="cta" href="https://github.com/RPD123-byte/vibecheck/releases/download/v0.2.2/Vibecheck-0.2.2-arm64.dmg">Install for macOS</a>
        <a class="cta-github" href="https://github.com/RPD123-byte/vibe-check" target="_blank" rel="noopener" aria-label="View vibe-check on GitHub">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
      <div class="cta-sub">Apple Silicon · .dmg · free</div>
    </div>
    <div class="faces fade-item">
      <div class="face">😠</div>
      <div class="face">😲</div>
      <div class="face">🤢</div>
      <div class="face">😄</div>
    </div>
  </main>

  <script>
    // Gentle fade-in on load
    requestAnimationFrame(() => document.body.classList.add('revealed'));
  </script>
</body>
</html>
